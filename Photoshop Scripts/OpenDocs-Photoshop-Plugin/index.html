<!DOCTYPE html>
<html>
<head>
<style>
    html, body { height: 100%; }
    body {
        overflow-y: scroll;
        overflow-x: hidden;
        margin: 0;
        padding: 8px 10px 14px;
        font-family: "SF Pro Text", "Helvetica Neue", sans-serif;
        font-size: 11px;
        color: #d6d6d6;
    }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 8px; }
    .bar h1 { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; margin: 0 auto 0 0; color: #e8e8e8; white-space: nowrap; cursor: default; }
    .bar .sz { font-size: 10px; color: #9a9a9a; min-width: 16px; text-align: center; font-variant-numeric: tabular-nums; }
    button {
        padding: 2px 0; width: 24px; border-radius: 3px; border: 1px solid #555; background: #333;
        color: #e6e6e6; font-size: 11px; line-height: 14px; cursor: pointer; text-align: center;
    }
    button.wide { width: 38px; font-size: 9.5px; letter-spacing: 0.03em; }
    button:hover { background: #3e3e3e; }
    button:disabled { opacity: 0.35; cursor: default; }
    #grid { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
    .tile {
        box-sizing: border-box; border: 2px solid transparent; border-radius: 5px;
        padding: 4px; background: #2a2a2a; cursor: pointer; overflow: hidden;
    }
    .tile:hover { background: #343434; }
    .tile.active { border-color: #4a8de0; background: #2f3a48; }
    .frame {
        display: flex; align-items: center; justify-content: center;
        background: #1c1c1c; border-radius: 3px; overflow: hidden;
    }
    .frame img { display: block; max-width: 100%; max-height: 100%; }
    .frame .ph { color: #666; font-size: 10px; text-align: center; padding: 6px; }
    .name {
        margin-top: 4px; color: #e0e0e0; font-size: 11px; line-height: 1.3;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .name .dirty { color: #d9b36c; margin-right: 3px; }
    .meta { color: #7f7f7f; font-size: 9.5px; margin-top: 1px; font-variant-numeric: tabular-nums;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status { margin-top: 8px; font-size: 10px; color: #7a7a7a; min-height: 12px; white-space: pre-line; }
    #status.err { color: #c98080; }
    #empty { color: #777; font-size: 11px; padding: 20px 4px; text-align: center; }
</style>
</head>
<body>
    <div class="bar">
        <h1 id="title">OPENDOCS</h1>
        <button id="smaller" title="Smaller thumbnails">−</button>
        <span class="sz" id="szLabel">S</span>
        <button id="larger" title="Larger thumbnails">+</button>
        <button class="wide" id="sort" title="Order: Photoshop's tab order. Click for alphabetical.">TABS</button>
        <button id="refresh" title="Re-read every thumbnail">↻</button>
    </div>
    <div id="grid"></div>
    <div id="empty" style="display:none">No documents open.</div>
    <div id="status"></div>
    <script src="main.js"></script>
</body>
</html>
